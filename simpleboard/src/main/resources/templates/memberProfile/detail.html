<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleag.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout_board_list.html}"
>
<section layout:fragment="content" class="container vh-100">
    <div class="container d-flex align-items-center">
        <div class="row mb-3">
            <form class="container col-5">
                <input type="hidden" class="form-control" readonly name="id" th:value="${profileId}">
                <div class="mb-3">
                    <label class="form-label">nickname</label>
                    <input type="text" class="form-control" readonly name="nickname" th:value="${nickname}">
                </div>
            </form>
        </div>
        <div class="row">
            <button class="btn btn-primary" th:onclick="|location.href='@(members/profiles/modify?profileId=${profileId})'|">Modify</button>
        </div>
    </div>
</section>
<script layout:fragment="script" th:inline="javascript"></script>
</html>
